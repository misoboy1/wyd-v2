# 웹서버: 정적 파일(React) + /api → WAS 프록시 + /uploads 사진. ngrok이 이 서버(80)만 외부로 노출
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ngrok → nginx: 실제 클라이언트 IP = ngrok이 X-Forwarded-For 맨 끝에 붙인 값.
  # 클라이언트가 보낸 앞쪽 값은 위조 가능하므로 쓰지 않음(recursive off → 마지막 값 사용).
  # 신뢰 대상은 docker 내부망(ngrok 컨테이너)만.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_recursive off;

  upstream api { server api:3000; keepalive 16; }

  # 로그인 대입·대기열 채우기 방어: IP당 분당 10회(순간 5회 여유). API의 계정·IP 제한 앞단에서 먼저 거름
  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 보안 헤더: location에 add_header가 있으면 상위 것이 상속되지 않으므로 각 location에서 include
    include /etc/nginx/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # 실시간 알림(SSE): 버퍼링 끄고 긴 연결 유지
    location = /api/events {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
      include /etc/nginx/security-headers.conf;
    }

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # 클라이언트가 보낸 X-Forwarded-For를 그대로 넘기지 않고 확인된 IP로 덮어씀
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    # 업로드 사진(볼륨 공유, 읽기 전용)
    location /uploads/ {
      alias /srv/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
    }

    # 해시가 붙은 빌드 파일은 1년 캐시
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.conf; try_files $uri =404; }

    # SPA 라우팅: 없는 경로는 index.html (index.html 자체는 캐시 안 함)
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }
  }
}
