# 웹서버: 정적 파일(React) + /api → WAS 프록시 + /uploads 사진. ngrok이 이 서버(80)만 외부로 노출
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 12m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ngrok → nginx: 실제 클라이언트 IP는 X-Forwarded-For 첫 값
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;
  real_ip_recursive on;

  upstream api { server api:3000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; "" close; }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 보안 헤더: location에 add_header가 있으면 상위 것이 상속되지 않으므로 각 location에서 include
    include /etc/nginx/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # 실시간 알림(SSE): 버퍼링 끄고 긴 연결 유지
    location = /api/events {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
      include /etc/nginx/security-headers.conf;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    # 업로드 사진(볼륨 공유, 읽기 전용)
    location /uploads/ {
      alias /srv/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      include /etc/nginx/security-headers.conf;
    }

    # 해시가 붙은 빌드 파일은 1년 캐시
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/security-headers.conf; try_files $uri =404; }

    # SPA 라우팅: 없는 경로는 index.html (index.html 자체는 캐시 안 함)
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
      include /etc/nginx/security-headers.conf;
    }
  }
}
